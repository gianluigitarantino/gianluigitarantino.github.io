    /* stile ORIGINALE del toggle lingua */
    .language-switch {

      margin-bottom: 40px;
      text-transform: lowercase;

    .wip-text {

      color: var(--testo-ferro);
      text-decoration: none;
    }
  </style>

  <!-- Redirect intelligente in base alla lingua (solo prima volta) -->
  <script>
    (function () {
      const KEY = 'gt_lang';
      try {
        const stored = localStorage.getItem(KEY);
        if (!stored) {
          const userLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
          if (userLang && !userLang.startsWith('it')) {
            // prima visita, browser NON italiano → passa a EN
            localStorage.setItem(KEY, 'en');
            window.location.href = '/en/';
          } else {
            // prima visita, browser italiano → resta qui
            localStorage.setItem(KEY, 'it');
          }
        }
      } catch (e) {
        // se localStorage non è disponibile, ignora
      }
    })();
  </script>

<body>
  <main class="wip-wrapper">

    <!-- switch lingua -->
    <button class="language-switch" id="switch-to-en">
      en
    </button>

    <h1 class="wip-title">spazio in allestimento</h1>

    <p class="wip-email">
      per informazioni o portfolio: <a href="mailto:info@gianluigitarantino.com">info@gianluigitarantino.com</a>
    </p>

  </main>

  <script>
    (function () {
      const KEY = 'gt_lang';
      const btn = document.getElementById('switch-to-en');
      if (!btn) return;

      btn.addEventListener('click', function () {
        try {
          localStorage.setItem(KEY, 'en');
        } catch (e) {}
        window.location.href = '/en/';
      });
    })();
  </script>
