  <style>
    :root {

      --testo-ferro: #5a554e;

      --lingua: #8b8478;

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      background-color: var(--bg-pietra);
      font-family: "IBM Plex Sans", sans-serif;
      text-transform: lowercase;
      color: var(--testo-ferro);
    }

    .wip-wrapper {
      max-width: 760px;
      margin: 0 auto;
      padding: 80px 24px;
    }

    /* Stesso identico stile del toggle italiano */
    .language-switch {
      font-weight: 300;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      color: var(--lingua);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      margin-bottom: 40px;
      text-transform: lowercase;
    }

    .wip-eyebrow {
      font-weight: 300;
      font-size: 0.9rem;
      letter-spacing: 0.12em;
      color: var(--testo-sabbia-scura);
      margin: 0 0 32px;
    }

    .wip-title {
      font-weight: 400;
      font-size: 2rem;
      letter-spacing: 0.04em;
      color: var(--testo-ferro);
      margin: 0 0 24px;
    }

    .wip-text {
      font-weight: 300;
      font-size: 1rem;
      line-height: 1.7;
      color: var(--testo-ferro);
      margin: 0 0 24px;
    }

    .wip-email {
      font-weight: 300;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--testo-sabbia-scura);
      margin-top: 40px;
    }

    .wip-email a {
      color: var(--testo-ferro);
      text-decoration: none;
    }
