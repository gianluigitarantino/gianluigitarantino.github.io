<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512"
     viewBox="0 0 512 512">
  <style>
    /* diciamo al browser che abbiamo sia light che dark */
    :root { color-scheme: light dark; }

    /* --- modalità chiara (default) --- */
    .sfondo { fill: #f7f5f2; }   /* pietra chiara */
    .logo   { fill: #5a554e; }   /* ferro brunito */
    .punto  { fill: #cbbfa5; }   /* sabbia */

    /* --- modalità scura --- */
    @media (prefers-color-scheme: dark) {
      .sfondo { fill: #5a554e; }   /* fondo scuro */
      .logo   { fill: #f7f5f2; }   /* logo chiaro */
      .punto  { fill: #cbbfa5; }   /* puoi lasciarlo uguale */
    }

    /* --- schermi wide gamut (P3) ---
       solo se il display lo supporta, rendiamo il punto un po' più vivo */
    @media (color-gamut: p3) {
      .punto { fill: color(display-p3 0.82 0.74 0.54); }
    }
  </style>

  <!-- sfondo principale -->
  <rect class="sfondo" width="512" height="512"/>

