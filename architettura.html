    <script>
        // Questa funzione cambia il titolo della scheda del browser
        function updatePageTitle(lang) {
            const titles = {
    'it': 'architettura - gianluigi tarantino',
    'en': 'architecture - gianluigi tarantino'
};
            document.title = titles[lang] || titles['it'];
        }

        (function () {
            // 1. Recupera la lingua salvata o usa l'italiano come base
            const lang = localStorage.getItem('language') || 'it';
            // 2. Applica la lingua al tag HTML (fa funzionare il CSS sopra)
            document.documentElement.setAttribute('lang', lang);
            // 3. Aggiorna il titolo della scheda
            updatePageTitle(lang);
        })();

        // Funzione da richiamare sui tuoi pulsanti IT/EN
        function setLanguage(lang) {
            document.documentElement.setAttribute('lang', lang);
            localStorage.setItem('language', lang);
            updatePageTitle(lang);
        }
    </script>

    <script>
        const favicon = document.getElementById('dynamic-favicon');
        function updateFavicon(theme) {
            if (favicon) {
                favicon.href = theme === 'dark' ? 'immagini/favicon-dark.svg' : 'immagini/favicon-light.svg';
            }
        }
        const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        updateFavicon(isDark ? 'dark' : 'light');
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            updateFavicon(e.matches ? 'dark' : 'light');
        });
    </script>
